<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painéis Veiga Partners</title>
<style>
:root{
  --bg:#ebebeb; --panel:#ffffff; --panel2:#f5f5f5; --ink:#3c3c3c; --ink2:#1f1f1f; --muted:#5c5c5c; --faint:#8a8a8a;
  --line:#e2e2e2; --line2:#cecece; --accent:#000000; --graf:#dcdcdc;
  --foto-op:.5; --card-bg:rgba(255,255,255,.86);
  --vp-orange:#F57127; /* laranja Veiga Partners (apresentação institucional) */
  --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 6px rgba(0,0,0,.05);
  --shadow-h:0 18px 40px -18px rgba(0,0,0,.35),0 6px 14px -8px rgba(0,0,0,.18);
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif; --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1c1c; --panel:#262626; --panel2:#2d2d2d; --ink:#e6e6e6; --ink2:#ffffff; --muted:#b4b4b4; --faint:#8a8a8a;
    --line:#343434; --line2:#464646; --accent:#ffffff; --graf:#242424; --foto-op:.22; --card-bg:rgba(38,38,38,.86);
    --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-h:0 22px 48px -20px rgba(0,0,0,.9),0 8px 18px -10px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1c1c; --panel:#262626; --panel2:#2d2d2d; --ink:#e6e6e6; --ink2:#ffffff; --muted:#b4b4b4; --faint:#8a8a8a;
  --line:#343434; --line2:#464646; --accent:#ffffff; --graf:#242424; --foto-op:.22; --card-bg:rgba(38,38,38,.86);
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-h:0 22px 48px -20px rgba(0,0,0,.9),0 8px 18px -10px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;position:relative}
a{color:inherit}

/* grafismo "+" da marca, ao fundo */
.graf{position:fixed;color:var(--vp-orange);pointer-events:none;z-index:0;animation:drift 1.2s var(--ease) both}
.graf svg{width:100%;height:100%;display:block}
.g1{width:340px;height:340px;right:-90px;top:-80px}
.g2{width:160px;height:160px;left:-60px;bottom:-60px;animation-delay:.15s}
@keyframes drift{from{opacity:0;transform:translate(24px,24px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:56px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;animation:fadeUp .6s var(--ease) both}
.logo{height:72px;width:auto;color:var(--ink2);display:block}
.theme{border:1px solid var(--line2);background:var(--panel);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.theme svg{width:18px;height:18px}
.theme .sun{display:none}
:root[data-theme="dark"] .theme .sun{display:block} :root[data-theme="dark"] .theme .moon{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .theme .sun{display:block}:root:not([data-theme="light"]) .theme .moon{display:none}}

.hero{margin:64px 0 28px;animation:fadeUp .6s .08s var(--ease) both}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 10px}
h1{text-wrap:balance;font-size:clamp(28px,4.4vw,42px);line-height:1.1;letter-spacing:-.025em;color:var(--ink2);margin:0;font-weight:700}
.hero p{color:var(--muted);margin:12px 0 0;max-width:560px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:14px;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);
  transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .25s var(--ease);animation:fadeUp .6s var(--ease) both;min-height:200px;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-h);border-color:var(--line2)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.card .top{display:flex;align-items:center;justify-content:space-between}
.ico{width:44px;height:44px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2)}
.ico svg{width:22px;height:22px}
.key{font-size:11px;color:var(--faint);border:1px solid var(--line2);border-radius:6px;padding:1px 6px}
.card h2{margin:0;font-size:19px;letter-spacing:-.01em;color:var(--ink2)}
.card p{margin:0;color:var(--muted);font-size:14px;flex:1}
.card .go{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--faint);border-top:1px solid var(--line);padding-top:12px}
.card .go b{color:var(--ink2);font-weight:600}
.card .arrow{width:18px;height:18px;transition:transform .25s var(--ease)}
.card:hover .arrow{transform:translateX(4px)}
.tag{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.last{position:absolute;top:-9px;left:20px;background:var(--ink2);color:var(--bg);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.soon{opacity:.55;pointer-events:none;border-style:dashed;box-shadow:none}

footer{margin-top:48px;color:var(--faint);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* foto de fundo (recepção da Veiga): levemente transparente; os links ficam na faixa de parede branca entre o quadro e a porta */
body::before{content:"";position:fixed;inset:0;background:url("fundo.jpg") 52% center/cover no-repeat;opacity:var(--foto-op);z-index:0;pointer-events:none;animation:fadeIn 1s var(--ease) both}
@keyframes fadeIn{from{opacity:0}}
.card{background:var(--card-bg);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

@media (min-width:1000px){
  :root{--cw:clamp(330px,21vw,410px)}
  header{position:fixed;top:28px;left:40px;right:40px;z-index:2}
  .wrap{max-width:none;width:var(--cw);margin:0 0 0 calc(52.5vw - var(--cw) / 2);padding:104px 0 28px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
  .hero{margin:0 0 18px}
  h1{font-size:27px}
  .hero p{font-size:14px}
  .grid{grid-template-columns:1fr;gap:10px}
  /* cards compactos em linha: ícone | título + descrição | seta, para caber vários painéis sem rolar */
  .card{min-height:0;padding:12px 16px;display:grid;grid-template-columns:44px 1fr 18px;column-gap:14px;row-gap:2px;align-items:center}
  .card .top{display:contents}
  .card .ico{grid-column:1;grid-row:1 / span 2}
  .card .key{position:absolute;top:10px;right:12px}
  .card > div:not(.top):not(.go){grid-column:2;grid-row:1}
  .card h2{font-size:17px}
  .card p{grid-column:2;grid-row:2;font-size:13px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .card .go{grid-column:3;grid-row:1 / span 2;border:0;padding:0;align-self:center}
  .card .go b{display:none}
  footer{margin-top:16px;flex-direction:column;gap:2px}
}

/* telas mais baixas: some a descrição (fica no tooltip) para caber todos os painéis sem rolar */
@media (min-width:1000px) and (max-height:940px){
  .wrap{padding-top:82px!important}
  h1{font-size:24px}
  .grid{gap:8px!important}
  .card{padding:9px 14px!important}
  .card .ico{width:36px;height:36px}
  .card p{display:none}
  .card > div:not(.top):not(.go){grid-row:1 / span 2}
  .hero p:not(.kicker){display:none}
}

@media (max-width:600px){
  :root{--foto-op:.3}
  .wrap{padding-top:28px}
  .hero{margin:40px 0 22px}
  .g1{width:220px;height:220px;right:-80px;top:-60px}
  .logo{height:50px}
  .key{display:none}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const ultimo = LS.get("hub.ultimo");

document.getElementById("grid").innerHTML = PAINEIS.map((p, i) => `

  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const n = parseInt(e.key, 10);
  const p = PAINEIS[n - 1];
  if (p && !p.emBreve) { LS.set("hub.ultimo", p.url); location.href = p.url; }
});

const t = LS.get("hub.theme"); if (t) document.documentElement.dataset.theme = t;
document.getElementById("theme").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const nxt = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = nxt; LS.set("hub.theme", nxt);
};
